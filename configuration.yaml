# Loads default set of integrations. Do not remove.
default_config:

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 192.168.1.0/24 # or the specific Caddy host IP

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

sensor:
  - platform: avanza_stock
    stock: 155541
    currency: USD

prometheus:
  namespace: homeassistant # metrics prefix, e.g. hass_sensor_temperature_c
  filter:
    include_domains:
      - sensor
      - binary_sensor
      - light
      - climate
      - person
      - device_tracker
      - fan
      - switch

rest_command:
  send_gps_data:
    url: 'http://geopulse.lan/api/homeassistant'
    method: POST
    headers:
      content-type: 'application/json'
      Authorization: !secret geopulse_bearer
    payload: >
      {
        "device_id": "sm_s911b",
        "timestamp": "{{ now().isoformat() }}",
        "location": {
          "latitude": {{ state_attr('device_tracker.sm_s911b', 'latitude') }},
          "longitude": {{ state_attr('device_tracker.sm_s911b', 'longitude') }},
          "accuracy": {{ state_attr('device_tracker.sm_s911b', 'gps_accuracy') | default(0, true) }},
          "altitude": {{ state_attr('device_tracker.sm_s911b', 'altitude') | default(0, true) }},
          "speed": {{ state_attr('device_tracker.sm_s911b', 'speed') | default(0, true) }}
        },
        "battery": {
          "level": {{ state_attr('device_tracker.sm_s911b', 'battery_level') | default(states('sensor.sm_s911b_battery_level'), true) | default(0, true) }}
        }
      }


automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
